<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI DnD Realms — Realms Engine</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171d27;--line:#2a3342;--text:#e9edf4;--muted:#8f9bad;--accent:#d7a84b;--good:#66d18f;--bad:#ef7373;--blue:#72a7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182131 0,#090b10 48%);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:58px 1fr 34px}.top{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#0c1017eF}.brand{font-weight:800;letter-spacing:.06em;color:var(--accent)}.top .spacer{flex:1}.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;color:var(--muted)}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{border-color:#55627a;background:#202938}button.primary{background:#806125;border-color:#ad8540}.main{min-height:0;display:grid;grid-template-columns:250px minmax(360px,1fr) 330px;gap:10px;padding:10px}.panel{background:#0e131ae8;border:1px solid var(--line);border-radius:12px;min-height:0;overflow:hidden}.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0;padding:12px;border-bottom:1px solid var(--line)}.left,.right{display:flex;flex-direction:column}.stats{padding:12px}.bar{height:8px;background:#262d38;border-radius:99px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:var(--good)}.bar.hp i{background:#d76b6b}.bar.mana i{background:#6b9de0}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#141a23;border:1px solid #222b37;border-radius:8px;padding:7px}.stat b{display:block;font-size:11px;color:var(--muted)}.list{padding:8px;overflow:auto}.item{display:flex;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #1d2530}.item small{color:var(--muted)}.center{position:relative;display:grid;grid-template-rows:minmax(260px,1fr) 240px;gap:10px;min-height:0}.world{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#080b10}.world canvas{display:block;width:100%!important;height:100%!important}.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.hud>div{background:#080b10cc;border:1px solid #344052;border-radius:8px;padding:8px 10px}.narrative{display:grid;grid-template-rows:1fr auto;background:#0e131a;border:1px solid var(--line);border-radius:12px;min-height:0}.feed{overflow:auto;padding:12px}.entry{margin:0 0 10px}.entry .who{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.entry .body{white-space:pre-wrap}.choices{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border-top:1px solid var(--line)}.choice{flex:1 1 220px;text-align:left}.composer{display:flex;gap:7px}.composer input{flex:1;min-width:0;background:#080b10;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:6px;font-size:12px}.tab{display:none;min-height:0;overflow:auto}.tab.active{display:block}.footer{display:flex;align-items:center;padding:0 12px;color:var(--muted);border-top:1px solid var(--line);font-size:11px}.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:2px 5px;margin:2px;color:var(--muted)}.danger{color:var(--bad)}.good{color:var(--good)}.gold{color:#f0c86a}@media(max-width:1050px){.main{grid-template-columns:210px 1fr}.right{display:none}}@media(max-width:720px){body{overflow:auto}.shell{height:auto;min-height:100vh}.main{grid-template-columns:1fr;padding:6px}.left{display:none}.center{grid-template-rows:55vh 310px}.top{gap:8px;padding:0 10px}.brand{font-size:12px}}
</style></head>
<body><div class="shell">
<header class="top"><div class="brand">⚔ AI DND REALMS</div><div id="location" class="pill">The Unknown</div><div class="spacer"></div><div id="turn" class="pill">TURN 1</div><button id="save">Save</button><button id="load">Load</button></header>
<main class="main">
<aside class="panel left"><h3>Character</h3><div class="stats"><b id="heroName">Adventurer</b><div class="bar hp"><i id="hpbar" style="width:100%"></i></div><div id="hptext">20 / 20 HP</div><div class="bar mana"><i id="mpbar" style="width:100%"></i></div><div id="mptext">10 / 10 MP</div><p class="gold">🪙 <span id="gold">25</span> gold</p><div class="statgrid" id="stats"></div></div><h3>Talents</h3><div class="list" id="talents"></div><h3>Conditions</h3><div class="list" id="conditions"></div></aside>
<section class="center"><div class="world"><div id="game"></div><div class="hud"><div id="sceneTitle">A new realm awaits</div><div id="threat">Threat 0</div></div></div><section class="narrative"><div id="feed" class="feed"></div><div><div id="choices" class="choices"></div><div class="composer" style="padding:10px"><input id="intent" placeholder="Describe an action…"><button class="primary" id="act">Act</button></div></div></section></section>
<aside class="panel right"><div class="tabs"><button data-tab="inv">Inventory</button><button data-tab="world">World</button><button data-tab="log">Log</button></div><div id="tab-inv" class="tab active"><div class="list" id="inventory"></div></div><div id="tab-world" class="tab"><div class="list" id="worldState"></div></div><div id="tab-log" class="tab"><div class="list" id="audit"></div></div></aside>
</main><footer class="footer"><span id="status">Ready</span><span style="margin-left:auto">Local-first save • deterministic rules • AI narration adapter</span></footer></div>
<script>
const KEY='ai-dnd-realms:v2';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const initial=()=>({version:2,turn:1,location:'Whispering Crossroads',scene:'A cracked road beneath a violet sky.',player:{name:'Kael',level:1,xp:0,hp:24,maxHp:24,mp:10,maxMp:10,gold:25,stats:{might:3,agility:3,mind:2,will:2},inventory:[{id:'rust-sword',name:'Rustbound Sword',type:'weapon',power:4,equipped:true},{id:'herb',name:'Moonleaf',type:'consumable',heal:8,qty:2}],talents:{ironWill:0,quickHands:0,arcaneEdge:0},conditions:[]},world:{day:1,threat:0,flags:{},factions:{Wardens:0,VeiledCourt:0,FreeMerchants:0},reputation:{},npcs:{}},history:[],pending:null,ai:{memory:[],summary:''}});
let S=initial(), saving=false;
function $(id){return document.getElementById(id)}
function log(kind,text){S.history.push({turn:S.turn,kind,text,ts:Date.now()});S.history=S.history.slice(-120);renderFeed();renderAudit()}
function renderFeed(){const f=$('feed');f.innerHTML=S.history.map(e=>`<div class="entry"><div class="who">${e.kind} · turn ${e.turn}</div><div class="body">${escapeHtml(e.text)}</div></div>`).join('');f.scrollTop=f.scrollHeight}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const p=S.player;$('heroName').textContent=`${p.name} · Level ${p.level}`;$('location').textContent=S.location;$('turn').textContent=`TURN ${S.turn}`;$('sceneTitle').textContent=S.scene;$('threat').textContent=`Threat ${S.world.threat}`;$('gold').textContent=p.gold;$('hptext').textContent=`${p.hp} / ${p.maxHp} HP`;$('mptext').textContent=`${p.mp} / ${p.maxMp} MP`;$('hpbar').style.width=`${p.hp/p.maxHp*100}%`;$('mpbar').style.width=`${p.mp/p.maxMp*100}%`;$('stats').innerHTML=Object.entries(p.stats).map(([k,v])=>`<div class="stat"><b>${k}</b>${v}</div>`).join('');$('talents').innerHTML=Object.entries(p.talents).map(([k,v])=>`<div class="item"><span>${k}</span><small>Rank ${v}/3</small></div>`).join('');$('conditions').innerHTML=p.conditions.length?p.conditions.map(c=>`<span class="tag">${escapeHtml(c.name)} ${c.turns||''}</span>`).join(''):'<small>None</small>';$('inventory').innerHTML=p.inventory.map(i=>`<div class="item"><span>${i.equipped?'◆ ':''}${escapeHtml(i.name)}${i.qty?` ×${i.qty}`:''}</span><small>${i.power?'ATK '+i.power:i.heal?'HEAL '+i.heal:i.type}</small></div>`).join('');$('worldState').innerHTML=`<div class="item"><span>Day</span><b>${S.world.day}</b></div><div class="item"><span>Threat</span><b>${S.world.threat}</b></div>`+Object.entries(S.world.factions).map(([k,v])=>`<div class="item"><span>${k}</span><b>${v>0?'+':''}${v}</b></div>`).join('');renderFeed();renderAudit()}
function renderAudit(){ $('audit').innerHTML=S.history.slice(-40).reverse().map(e=>`<div class="item"><span>${escapeHtml(e.text.slice(0,100))}</span><small>T${e.turn}</small></div>`).join('') }
function roll(sides=20){const n=1+Math.floor(Math.random()*sides);return n}
function check(stat,dc=12){const r=roll(20),mod=S.player.stats[stat]||0,bonus=Math.floor((S.player.level-1)/2);return {r,mod,bonus,total:r+mod+bonus,success:r===20||(r!==1&&r+mod+bonus>=dc),dc}}
function advance(){S.turn++;for(const c of S.player.conditions){c.turns--;};S.player.conditions=S.player.conditions.filter(c=>c.turns>0);if(S.turn%6===0){S.world.day++;S.world.threat=clamp(S.world.threat+1,0,10)}}
function addXp(n){S.player.xp+=n;const need=S.player.level*100;if(S.player.xp>=need){S.player.xp-=need;S.player.level++;S.player.maxHp+=5;S.player.hp=S.player.maxHp;S.player.maxMp+=2;S.player.mp=S.player.maxMp;log('LEVEL UP',`You reach level ${S.player.level}. Vitality and focus surge through you.`)}}
function combat(enemy='Revenant Scout'){const r=check('might',13);const dmg=Math.max(1,roll(6)+S.player.stats.might);if(r.success){S.world.threat=clamp(S.world.threat-1,0,10);addXp(35);log('COMBAT',`⚔ You strike the ${enemy}. d20 ${r.r} + ${r.mod} = ${r.total} vs ${r.dc}. ${r.r===20?'CRITICAL! ':''}${dmg} damage. The enemy breaks.`)}else{const taken=roll(5)+1;S.player.hp=clamp(S.player.hp-taken,0,S.player.maxHp);S.world.threat=clamp(S.world.threat+1,0,10);log('COMBAT',`The ${enemy} turns the exchange. d20 ${r.r} + ${r.mod} = ${r.total} vs ${r.dc}. You take ${taken} damage.`);if(S.player.hp===0){S.player.hp=Math.ceil(S.player.maxHp*.35);S.player.gold=Math.max(0,S.player.gold-5);log('DEFEAT','You collapse, but wake later with your gear intact. Five gold is gone.')}}}
function choose(text){$('choices').innerHTML='';log('CHOICE',text);const lower=text.toLowerCase();if(lower.includes('fight')||lower.includes('attack'))combat();else if(lower.includes('persuade')){const r=check('will',14);if(r.success){S.world.factions.FreeMerchants++;S.world.flags.persuaded=true;log('CHECK',`Persuasion succeeds: d20 ${r.r} + ${r.mod} = ${r.total}. The merchant trusts you.`)}else log('CHECK',`Persuasion fails: d20 ${r.r} + ${r.mod} = ${r.total}.`)}else if(lower.includes('rest')){S.player.hp=S.player.maxHp;S.player.mp=S.player.maxMp;S.player.gold=Math.max(0,S.player.gold-1);log('REST','You spend the night and recover completely.')}else{const r=check('mind',12);log('CHECK',`${text}: d20 ${r.r} + ${r.mod} = ${r.total} vs ${r.dc}. ${r.success?'Success.':'Failure.'}`)}advance();render();save()}
function localFallback(intent){const r=check('mind',12);const lines=r.success?[`The realm answers your intent. ${intent} changes the situation in your favor.`,`A distant bell rings. Someone, somewhere, has noticed what you did.`]:[`Your action creates an opening, but not the one you expected.`,`The silence after your attempt feels deliberate.`];S.scene=lines[0];log('NARRATOR',lines[Math.floor(Math.random()*lines.length)]);$('choices').innerHTML=['Investigate the omen','Approach cautiously','Prepare for danger'].map(x=>`<button class="choice">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.textContent));advance();render()}
async function ai(intent){if(saving)return;saving=true;$('status').textContent='AI narrator working…';const memory=S.ai.memory.slice(-8).map(x=>`${x.role}: ${x.text}`).join('\n');const payload={messages:[{role:'system',content:'You are the deterministic narrative director for a browser RPG. Return only player-visible narration. Do not alter stats directly. Produce concise prose followed by exactly three choices, each on its own line prefixed CHOICE:. Respect world facts and prior memory.'},{role:'user',content:`STATE location=${S.location}; threat=${S.world.threat}; factions=${JSON.stringify(S.world.factions)}; flags=${JSON.stringify(S.world.flags)}; player=${JSON.stringify({level:S.player.level,stats:S.player.stats,conditions:S.player.conditions})}\nMEMORY:${memory}\nPLAYER ACTION:${intent}`}],temperature:.8,max_tokens:500,stream:false};try{const base=localStorage.getItem('AI_DND_API_BASE')||'';const res=await fetch(base.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();const text=data?.choices?.[0]?.message?.content?.trim();if(!text)throw new Error('empty narration');S.ai.memory.push({role:'player',text:intent},{role:'narrator',text});const parts=text.split(/\n+/).map(x=>x.trim()).filter(Boolean),choices=parts.filter(x=>/^CHOICE:/i.test(x)).map(x=>x.replace(/^CHOICE:\s*/i,'')),narration=parts.filter(x=>!/^CHOICE:/i.test(x)).join('\n');S.scene=narration.split('\n')[0]||S.scene;log('NARRATOR',narration);$('choices').innerHTML=(choices.length?choices:['Continue','Investigate','Make camp']).slice(0,3).map(x=>`<button class="choice">${escapeHtml(x)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.textContent));advance();render();save()}catch(e){log('SYSTEM',`AI unavailable (${e.message}). Local narrative fallback engaged.`);localFallback(intent)}finally{saving=false;$('status').textContent='Ready'}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));$('status').textContent='Saved locally'}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const x=JSON.parse(raw);if(x.version!==2)throw new Error('unsupported save');S=x;render();log('SYSTEM','Save restored.')}catch(e){localStorage.removeItem(KEY);S=initial();render();log('SYSTEM','Corrupt save discarded; a clean realm was created.')}}
$('act').onclick=()=>{const v=$('intent').value.trim();if(v){$('intent').value='';log('PLAYER',v);ai(v)}};$('intent').addEventListener('keydown',e=>{if(e.key==='Enter')$('act').click()});$('save').onclick=save;$('load').onclick=load;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('tab-'+b.dataset.tab).classList.add('active')});
const game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:800,height:450,backgroundColor:'#080b10',scene:{create(){this.add.text(30,30,'REALM SIMULATION',{fontFamily:'monospace',fontSize:'18px',color:'#d7a84b'});this.add.text(30,60,'The world is driven by state, not by the renderer.',{fontFamily:'monospace',fontSize:'12px',color:'#8f9bad'});this.add.circle(400,225,70,0x171d27);this.add.circle(400,225,52,0x222b37);this.add.text(365,213,'⚔',{fontSize:'32px'});},update(){}}});
render();log('SYSTEM','Realm Engine v2 initialized. Deterministic rules are active; AI is an optional narrative layer.');
</script></body></html>
